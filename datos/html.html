<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertidor XLSX → JSON (con peso y talla)</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 950px;
      margin: 30px auto;
      padding: 20px;
      background: #f4f6f9;
      color: #333;
    }
    h1 { text-align: center; color: #2c3e50; }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .input-group { margin-bottom: 20px; }
    input[type="file"] { display: block; margin-top: 10px; }
    .options { margin: 15px 0; }
    .options label { margin-left: 5px; font-weight: normal; }
    button {
      background: #3498db;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }
    button:hover { background: #2980b9; }
    pre {
      background: #272822;
      color: #f8f8f2;
      padding: 15px;
      border-radius: 5px;
      max-height: 450px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .badge {
      background: #e74c3c;
      color: #fff;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 13px;
      margin-left: 10px;
    }
    .info {
      background: #eaf2f8;
      padding: 10px;
      border-radius: 4px;
      margin: 10px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📊 Convertidor XLSX → JSON<br><small style="font-size:0.6em;">Todos los campos + Edad calculada</small></h1>

  <div class="input-group">
    <label for="excelFile"><strong>Selecciona tu archivo Excel (.xlsx / .xls):</strong></label>
    <input type="file" id="excelFile" accept=".xlsx, .xls" />
  </div>

  <div class="options">
    <input type="checkbox" id="includeIncomplete" checked>
    <label for="includeIncomplete">Incluir filas con <code>num_doc</code> vacío</label>
    <small style="display:block; color:#666; margin-top:4px;">Si está desmarcado, se excluyen filas sin número de identificación.</small>
  </div>

  <div class="options">
    <input type="checkbox" id="removeSparse" checked>
    <label for="removeSparse">Eliminar filas que solo tengan <code>num_doc</code> (incompletas)</label>
    <small style="display:block; color:#666; margin-top:4px;">Recomendado: descarta registros que carecen de los demás datos.</small>
  </div>

  <div class="info" id="infoPanel">
    <strong>Registros extraídos:</strong> <span id="countRecords">0</span>
  </div>

  <div class="actions">
    <button id="downloadBtn" style="display: none;">⬇ Descargar JSON limpio</button>
  </div>

  <h3>Resultado JSON:</h3>
  <pre id="jsonResult">Carga un archivo para ver el resultado aquí...</pre>
</div>

    "71 - SumInIstro de vItamIna A en la prImera InfancIa   AplI. (2 a 5 aNos)": "suministro_vitamina_a",
    "72 - Fecha de toma LDL  AplI. >= 29 aNos  Va con la 92": "fecha_toma_ldl",

    "82 - Fecha de toma de prueba para VIH  (Toda la poblacIOn)": "fecha_toma_vih",

    "84 -Fecha de TSH neonatal": "fecha_tsh_neonatal",
    "85 - Resultado de TSH neonatal": "tsh_neonatal_res",
    "86 - TamIzaje del cAncer de cuello uterIno ": "tamizaje_cervix_tipo",

    "101 - Resultado de bIopsIa de mama": "biopsia_mama_res",

    "104 - Resultado de hemoglobIna": "hemoglobina_res",

    "108 - PreservatIvos entregados a pacIentes con ITS -": "preservativos_its_2",
    "109 - Resultado de PSA  va con la 73 prostata": "psa_res",
    "110 - Fecha de toma  de tamIzaje hepatItIs C   ??? va con la 42": "fecha_toma_hepatitis_c",
    "111 - Fecha de toma HDL  AplI. >= 29 aNos  Va con la  95": "fecha_toma_hdl",
    "112 - Fecha de toma de bacIloscopIa dIagnOstIco ": "fecha_toma_baciloscopia",
    "113 - Resultado de bacIloscopIa dIagnOstIco": "baciloscopia_res",
    "114 - ClasIfIcacIOn del rIesgo cardIovascular ": "frecuencia_cardiaco_riesgo",
    "115 - TratamIento para sIfIlIs gestacIonal ": "sifilis_gest_tratamiento",
    "116 - TratamIento para SIfIlIs CongEnIta-  ": "sifilis_cong_tratamiento",
    "117 - ClasIfIcacIOn del rIesgo metabOlIco": "riesgo_metabolico",
    "118 - Fecha de toma trIglIcErIdos AplI. >= 29 aNos  va con la 98": "fecha_toma_trigliceridos"
  };

  let generatedJson = null;

  // Función para calcular la edad exacta en años según la fecha dada
  function calcularEdad(fechaVal) {
    if (!fechaVal) return null;
    let fechaNac;

    // Si Excel importó la fecha como entero serial
    if (typeof fechaVal === 'number') {
      const parsedDate = XLSX.SSF.parse_date_code(fechaVal);
      if (parsedDate) {
        fechaNac = new Date(parsedDate.y, parsedDate.m - 1, parsedDate.d);
      }
    } else {
      // Si viene como string tipo "2010-09-02" o similar
      fechaNac = new Date(fechaVal);
    }

    if (!fechaNac || isNaN(fechaNac.getTime())) return null;

    const hoy = new Date();
    let edad = hoy.getFullYear() - fechaNac.getFullYear();
    const mesDiff = hoy.getMonth() - fechaNac.getMonth();

    if (mesDiff < 0 || (mesDiff === 0 && hoy.getDate() < fechaNac.getDate())) {
      edad--;
    }

    return edad >= 0 ? edad : null;
  }

  function procesarArchivo() {
    const fileInput = document.getElementById('excelFile');
    const file = fileInput.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });

      const includeIncomplete = document.getElementById('includeIncomplete').checked;
      const removeSparse = document.getElementById('removeSparse').checked;
      const result = {};

      workbook.SheetNames.forEach(function(sheetName) {
        const roa = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 0 });

        // Transformar cada fila usando el mapeo
        let filasTransformadas = roa.map(fila => {
          const obj = {};
          for (const claveLarga of Object.keys(fila)) {
            if (mapeo.hasOwnProperty(claveLarga)) {
              const claveCorta = mapeo[claveLarga];
              obj[claveCorta] = fila[claveLarga];

              // Si es la fecha de nacimiento, calcular también la edad como entero
              if (claveCorta === 'fecha_nacimiento') {
                obj['edad'] = calcularEdad(fila[claveLarga]);
              }
            }
          }
          return obj;
        });

        // Filtrar por num_doc si es necesario
        if (!includeIncomplete) {
          filasTransformadas = filasTransformadas.filter(fila => {
            const val = fila.num_doc;
            return val !== undefined && val !== null && val !== '';
          });
        }

        // Eliminar filas que solo tengan num_doc (incompletas)
        if (removeSparse) {
          filasTransformadas = filasTransformadas.filter(fila => {
            const keys = Object.keys(fila);
            if (keys.length === 1 && keys[0] === 'num_doc') return false;

            const hasOtherData = keys.some(k => k !== 'num_doc' && fila[k] !== undefined && fila[k] !== null && fila[k] !== '');
            return hasOtherData;
          });
        }

        // Eliminar filas completamente vacías
        filasTransformadas = filasTransformadas.filter(fila => {
          return Object.values(fila).some(v => v !== undefined && v !== null && v !== '');
        });

        if (filasTransformadas.length) {
          result[sheetName] = filasTransformadas;
        }
      });

      generatedJson = result;

      // Mostrar JSON
      const jsonString = JSON.stringify(result, null, 2);
      document.getElementById('jsonResult').textContent = jsonString;

      // Contar registros totales
      let total = 0;
      for (const hoja of Object.keys(result)) {
        total += result[hoja].length;
      }
      document.getElementById('countRecords').textContent = total;

      document.getElementById('downloadBtn').style.display = 'inline-block';
    };

    reader.readAsArrayBuffer(file);
  }

  // Evento al cargar archivo
  document.getElementById('excelFile').addEventListener('change', procesarArchivo);

  // Reprocesar al cambiar cualquiera de los checkboxes
  document.getElementById('includeIncomplete').addEventListener('change', procesarArchivo);
  document.getElementById('removeSparse').addEventListener('change', procesarArchivo);

  // Descargar JSON
  document.getElementById('downloadBtn').addEventListener('click', function() {
    if (!generatedJson) return;

    const blob = new Blob([JSON.stringify(generatedJson, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'data_limpia.json';
    a.click();
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
